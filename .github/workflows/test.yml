name: Test

# Harness and correctness validation only. This workflow never runs throughput
# rankings, publishes benchmark data, or commits files. PR smoke lives in pr.yml.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Harness + correctness (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harness self-tests
        run: pnpm test:harness

      - name: Correctness confirmation (not timed)
        run: pnpm confirm

      - name: Upload confirmation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: confirm-linux
          path: |
            results/confirm.md
            results/confirm.json
          if-no-files-found: warn
          retention-days: 14
